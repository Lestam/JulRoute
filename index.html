<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e6e5e1; -webkit-text-size-adjust: 100%; }
  a { color: #c5402f; text-decoration: none; }
  a:hover { color: #a12f21; }

  /* ---- Мобильная вертикальная раскладка ----
     Разметка на inline-стилях, поэтому переопределения идут через !important.
     Логика превью: iframe шире контейнера в N раз и ужат scale(1/N).
     Макеты центрируются внутри своего документа (body{display:flex;justify-content:center;padding:48px}),
     поэтому виден весь постер, если ширина вьюпорта iframe >= 900 + 96 = ~1000px.
     N подобрано так, чтобы это условие держалось на узких экранах. */
  @media (max-width: 820px) {
    .dd-header { flex-direction: column !important; align-items: stretch !important; gap: 12px !important; padding: 12px 14px !important; }
    .dd-kicker { font-size: 9.5px !important; letter-spacing: 0.18em !important; }
    .dd-title  { font-size: 20px !important; }
    .dd-controls { gap: 10px !important; flex-wrap: wrap !important; }
    .dd-progress { min-width: 0 !important; flex: 1 1 100% !important; order: -1 !important; }
    .dd-btn { flex: 1 1 0 !important; padding: 11px 10px !important; }

    .dd-duel { grid-template-columns: 1fr !important; gap: 0 !important; padding: 14px 8px 28px !important; }
    .dd-card { padding: 8px !important; gap: 9px !important; }
    .dd-kbd { display: none !important; }
    .dd-preview { min-height: 0 !important; height: 430px !important; flex: none !important; }
    .dd-frame { width: 330% !important; height: 330% !important; transform: scale(0.30303) !important; }
    .dd-vs { flex-direction: row !important; gap: 12px !important; padding: 12px 4px !important; }
    .dd-vs-line { width: auto !important; height: 1px !important; flex: 1 1 auto !important; }
    .dd-pick { flex: 1 !important; text-align: center !important; padding: 12px 0 !important; border: 1px solid #c5402f !important; border-radius: 3px !important; }

    .dd-done { grid-template-columns: 1fr !important; gap: 26px !important; padding: 20px 12px 48px !important; }
    .dd-winner-name { font-size: 26px !important; }
    .dd-winner-box { height: 430px !important; }
    .dd-winner-frame { width: 330% !important; height: 330% !important; transform: scale(0.30303) !important; }
  }

  /* Узкие телефоны: контейнер меньше, поэтому нужен больший запас по ширине вьюпорта */
  @media (max-width: 380px) {
    .dd-frame, .dd-winner-frame { width: 380% !important; height: 380% !important; transform: scale(0.26316) !important; }
    .dd-preview, .dd-winner-box { height: 400px !important; }
  }
</style>
</helmet>

<div style="min-height:100vh;background:#e6e5e1;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;">

  <header class="dd-header" style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 40px;border-bottom:1px solid #d5d2c9;background:#eeece6;position:sticky;top:0;z-index:10;">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <div class="dd-kicker" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.26em;text-transform:uppercase;color:#8a877f;">Отбор макетов · парное сравнение</div>
      <div class="dd-title" style="font-family:'Spectral',serif;font-weight:500;font-size:24px;line-height:1;color:#20201d;">Что оставляем?</div>
    </div>
    <div class="dd-controls" style="display:flex;align-items:center;gap:28px;">
      <div class="dd-progress" style="display:flex;flex-direction:column;gap:6px;min-width:360px;">
        <div style="display:flex;justify-content:space-between;gap:20px;white-space:nowrap;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#7a776f;">
          <span>{{ stageLabel }}</span><span>{{ progressLabel }}</span>
        </div>
        <div style="height:4px;background:#dcd8ce;border-radius:2px;overflow:hidden;">
          <div style="height:100%;background:#c5402f;width:{{ progressPct }};transition:width .35s ease;"></div>
        </div>
      </div>
      <button class="dd-btn" onClick="{{ undo }}" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#57554e;background:transparent;border:1px solid #cac6bb;padding:9px 14px;border-radius:3px;cursor:pointer;" style-hover="border-color:#20201d;color:#20201d;">Назад</button>
      <button class="dd-btn" onClick="{{ reset }}" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#57554e;background:transparent;border:1px solid #cac6bb;padding:9px 14px;border-radius:3px;cursor:pointer;" style-hover="border-color:#20201d;color:#20201d;">Сброс</button>
    </div>
  </header>

  <sc-if value="{{ inDuel }}" hint-placeholder-val="{{ true }}">
    <div class="dd-duel" style="flex:1;display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;gap:0;padding:32px 40px 44px;">

      <div class="dd-card" onClick="{{ pickLeft }}" style="display:flex;flex-direction:column;gap:14px;cursor:pointer;padding:18px;border-radius:6px;border:1px solid transparent;transition:background .2s,border-color .2s;" style-hover="background:#eeece6;border-color:#cfcbc0;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:0.12em;background:#20201d;color:#f6f4ef;padding:5px 10px;border-radius:3px;">A</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:15px;color:#20201d;font-weight:500;">{{ leftName }}</span>
          <span class="dd-kbd" style="font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#9a968c;margin-left:auto;">← стрелка влево</span>
        </div>
        <div class="dd-preview" style="flex:1;min-height:520px;background:#fff;border:1px solid #d8d4c9;box-shadow:0 22px 50px -28px rgba(30,28,22,0.45);overflow:hidden;position:relative;">
          <iframe src="{{ leftSrc }}" title="{{ leftName }}" scrolling="no" class="dd-frame" style="position:absolute;top:0;left:0;width:250%;height:250%;transform:scale(0.4);transform-origin:top left;border:0;pointer-events:none;"></iframe>
        </div>
        <div style="display:flex;justify-content:center;">
          <span class="dd-pick" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#c5402f;">Выбрать этот</span>
        </div>
      </div>

      <div class="dd-vs" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
        <div class="dd-vs-line" style="width:1px;flex:1;background:#d5d2c9;"></div>
        <div style="font-family:'Spectral',serif;font-size:18px;color:#8a877f;">vs</div>
        <div class="dd-vs-line" style="width:1px;flex:1;background:#d5d2c9;"></div>
      </div>

      <div class="dd-card" onClick="{{ pickRight }}" style="display:flex;flex-direction:column;gap:14px;cursor:pointer;padding:18px;border-radius:6px;border:1px solid transparent;transition:background .2s,border-color .2s;" style-hover="background:#eeece6;border-color:#cfcbc0;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:0.12em;background:#20201d;color:#f6f4ef;padding:5px 10px;border-radius:3px;">B</span>
          <span style="font-family:'Space Grotesk',sans-serif;font-size:15px;color:#20201d;font-weight:500;">{{ rightName }}</span>
          <span class="dd-kbd" style="font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#9a968c;margin-left:auto;">стрелка вправо →</span>
        </div>
        <div class="dd-preview" style="flex:1;min-height:520px;background:#fff;border:1px solid #d8d4c9;box-shadow:0 22px 50px -28px rgba(30,28,22,0.45);overflow:hidden;position:relative;">
          <iframe src="{{ rightSrc }}" title="{{ rightName }}" scrolling="no" class="dd-frame" style="position:absolute;top:0;left:0;width:250%;height:250%;transform:scale(0.4);transform-origin:top left;border:0;pointer-events:none;"></iframe>
        </div>
        <div style="display:flex;justify-content:center;">
          <span class="dd-pick" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#c5402f;">Выбрать этот</span>
        </div>
      </div>

    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div class="dd-done" style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;padding:48px 40px 80px;align-items:start;">
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#c5402f;">Победитель</div>
        <div class="dd-winner-name" style="font-family:'Spectral',serif;font-weight:500;font-size:36px;line-height:1.08;color:#20201d;">{{ winnerName }}</div>
        <div class="dd-winner-box" style="background:#fff;border:1px solid #d8d4c9;box-shadow:0 30px 70px -34px rgba(30,28,22,0.5);overflow:hidden;position:relative;height:660px;">
          <iframe src="{{ winnerSrc }}" title="{{ winnerName }}" scrolling="no" class="dd-winner-frame" style="position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(0.5);transform-origin:top left;border:0;"></iframe>
        </div>
        <a href="{{ winnerSrc }}" target="_blank" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;">Открыть макет целиком →</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8a877f;">Итоговый рейтинг</div>
        <sc-for list="{{ ranking }}" as="r" hint-placeholder-count="6">
          <div style="display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid #dcd8ce;">
            <span style="font-family:'Space Mono',monospace;font-size:12px;color:#9a968c;width:22px;">{{ r.place }}</span>
            <span style="font-family:'Space Grotesk',sans-serif;font-size:14.5px;color:#20201d;flex:1;">{{ r.name }}</span>
            <span style="font-family:'Space Mono',monospace;font-size:11px;color:#7a776f;">{{ r.wins }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const CANDIDATES = [
  ['1A Museum Minimal', 'designs/1a-museum-minimal-21x30.html'],
  ['1B Sport Energetic', 'designs/1b-sport-energetic-21x30.html'],
  ['1C Technical GPS', 'designs/1c-technical-gps-21x30.html'],
  ['2A Color Block', 'designs/2a-color-block.html'],
  ['2B Topographic Poster', 'designs/2b-topographic-poster.html'],
  ['3A Colour Block · landscape', 'designs/3a-colour-block-landscape.html'],
  ['3B Topographic · landscape', 'designs/3b-topographic-landscape.html'],
  ['4A Light Gallery', 'designs/4a-light-gallery.html'],
  ['4B Dark Cinematic', 'designs/4b-dark-cinematic.html'],
  ['5A Dark Editorial Band', 'designs/5a-dark-editorial-band.html'],
  ['5B Typographic City', 'designs/5b-typographic-city.html'],
  ['5C Circle Field', 'designs/5c-circle-field.html'],
  ['5D Full Bleed Map', 'designs/5d-full-bleed-map.html'],
  ['5E Split Data Sheet', 'designs/5e-split-data-sheet.html'],
  ['8A A3 · 4 km Amsterdam · cobalt', 'designs/8a-a3-4km-amsterdam-cobalt.html'],
  ['8B A3 · 10 km Copenhagen · bone', 'designs/8b-a3-10km-copenhagen-bone.html'],
  ['8C A3 · Marathon Berlin · charcoal', 'designs/8c-a3-marathon-berlin-charcoal.html'],
  ['8D A3 · 4 km Amsterdam · forest', 'designs/8d-a3-4km-amsterdam-forest.html'],
  ['8E A3 · 10 km Copenhagen · silver', 'designs/8e-a3-10km-copenhagen-silver.html'],
  ['8F A3 · Marathon Berlin · cream', 'designs/8f-a3-marathon-berlin-cream.html'],
  ['9A Square · bone & terracotta', 'designs/9a-square-bone-terracotta.html'],
  ['9B Rounded square · teal & amber', 'designs/9b-rounded-square-teal-amber.html'],
  ['9C Hexagon · cream & cobalt', 'designs/9c-hexagon-cream-cobalt.html'],
  ['9D Triangle · forest & lime', 'designs/9d-triangle-forest-lime.html'],
  ['9E Disc · plum & sand', 'designs/9e-disc-plum-sand.html'],
  ['10A Рамка · ландшафт, боковая панель', 'designs/10a-framed-landscape-side-panel.html'],
  ['10B Рамка · портрет, белая панель', 'designs/10b-framed-portrait-white-panel.html'],
  ['10C Рамка · портрет, красный блок', 'designs/10c-framed-portrait-red-block.html'],
  ['10D Рамка · портрет, графит', 'designs/10d-framed-portrait-graphite.html']
];
const KEY = 'design-duel-v2';

/* ---- Аналитика: одно событие в момент определения чемпиона ----
   Отправка идёт прямо в Amplitude HTTP API v2, без SDK: нужен ровно один тип события,
   а лишний скрипт с CDN — это ещё одна точка отказа (см. историю с unpkg в 8x-макетах).
   Уникальные пользователи считаются по device_id — случайной строке в localStorage.
   Ничего персонального не собирается: только id макета-победителя.
   Пустой AMP_KEY полностью выключает отправку — сеть не трогается вообще. */
const AMP_KEY = '';                                                                      // ← API-ключ проекта JulRoute
const AMP_URL = 'https://api2.amplitude.com/2/httpapi';
const DEVICE_KEY = 'design-duel-device';

function deviceId(){
  try {
    let d = localStorage.getItem(DEVICE_KEY);
    if (!d){
      d = 'dd-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
      localStorage.setItem(DEVICE_KEY, d);
    }
    return d;
  } catch (e) { return 'dd-nostorage'; }
}

function track(eventType, props){
  if (!AMP_KEY) return false;
  const body = JSON.stringify({
    api_key: AMP_KEY,
    events: [{
      device_id: deviceId(),
      event_type: eventType,
      event_properties: props,
      time: Date.now(),
      platform: 'web'
    }]
  });
  try {
    // keepalive — чтобы запрос пережил закрытие вкладки сразу после финала
    fetch(AMP_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })
      .catch(() => {});
    return true;
  } catch (e) { return false; }
}

class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = this.load() || this.fresh();
  }

  fresh(){
    const idx = CANDIDATES.map((c, i) => i);
    for (let i = idx.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return { round: 1, pool: idx, queue: this.pairs(idx), next: [], m: 0, wins: {}, history: [], champion: null };
  }

  pairs(pool){
    const q = [];
    for (let i = 0; i < pool.length; i += 2) q.push([pool[i], pool[i + 1] === undefined ? null : pool[i + 1]]);
    return q;
  }

  load(){
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  componentDidMount(){
    this._key = e => {
      if (e.key === 'ArrowLeft') this.pick(0);
      if (e.key === 'ArrowRight') this.pick(1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount(){ window.removeEventListener('keydown', this._key); }

  pick(side){
    const s = this.state;
    const pair = s.queue[s.m];
    if (!pair) return;
    if (pair[1] === null) return this.advance(pair[0], side, true);
    this.advance(side === 0 ? pair[0] : pair[1], side, false);
  }

  advance(winner, side, bye){
    const s = this.state;
    const wins = Object.assign({}, s.wins);
    if (!bye) wins[winner] = (wins[winner] || 0) + 1;
    const next = s.next.concat([winner]);
    const snap = { round: s.round, pool: s.pool, queue: s.queue, next: s.next, m: s.m, wins: s.wins };
    const history = s.history.concat([{ prev: snap }]);
    let ns;
    if (s.m + 1 < s.queue.length){
      ns = { round: s.round, pool: s.pool, queue: s.queue, next: next, m: s.m + 1, wins: wins, history: history };
    } else if (next.length > 1){
      ns = { round: s.round + 1, pool: next, queue: this.pairs(next), next: [], m: 0, wins: wins, history: history };
    } else {
      ns = { round: s.round, pool: s.pool, queue: s.queue, next: next, m: s.m + 1, wins: wins, history: history, champion: next[0] };
      // Ровно одна точка, где появляется чемпион, поэтому событие уходит строго один раз.
      // При перезагрузке страницы advance() не вызывается — повторной отправки не будет.
      this.trackWin(next[0], ns);
    }
    this.save(ns);
    this.setState(ns);
  }

  trackWin(champIdx, s){
    const c = CANDIDATES[champIdx];
    if (!c) return;
    track('duel_completed', {
      winner_id: c[1].replace('designs/', '').replace('.html', ''),
      winner_name: c[0],
      rounds: s.round,
      candidates: CANDIDATES.length,
      viewport: window.innerWidth <= 820 ? 'mobile' : 'desktop'
    });
  }

  plural(n){
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return 'победа';
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return 'победы';
    return 'побед';
  }

  renderVals(){
    const s = this.state;
    const done = s.champion !== undefined && s.champion !== null;
    const pair = done ? null : s.queue[s.m];
    const left = pair ? CANDIDATES[pair[0]] : null;
    const right = pair && pair[1] !== null ? CANDIDATES[pair[1]] : null;

    if (pair && pair[1] === null && !done){
      // auto-advance a bye without asking
      setTimeout(() => this.advance(pair[0], 0, true), 0);
    }

    const total = s.queue.length;
    const ranking = Object.keys(s.wins)
      .map(k => ({ i: Number(k), wins: s.wins[k] }))
      .sort((a, b) => b.wins - a.wins)
      .slice(0, 10)
      .map((r, n) => ({ place: String(n + 1).padStart(2, '0'), name: CANDIDATES[r.i][0], wins: r.wins + ' ' + this.plural(r.wins) }));

    return {
      inDuel: !done && !!(left && right),
      isDone: done,
      leftName: left ? left[0] : '',
      leftSrc: left ? left[1] : '',
      rightName: right ? right[0] : '',
      rightSrc: right ? right[1] : '',
      stageLabel: 'Раунд ' + s.round + ' · участников ' + s.pool.length,
      progressLabel: done ? 'готово' : ('пара ' + Math.min(s.m + 1, total) + ' / ' + total),
      progressPct: done ? '100%' : (Math.round((s.m / Math.max(total, 1)) * 100) + '%'),
      winnerName: done ? CANDIDATES[s.champion][0] : '',
      winnerSrc: done ? CANDIDATES[s.champion][1] : '',
      ranking: ranking,
      pickLeft: () => this.pick(0),
      pickRight: () => this.pick(1),
      undo: () => {
        const h = s.history;
        if (!h.length) return;
        const prev = Object.assign({}, h[h.length - 1].prev, { history: h.slice(0, -1), champion: null });
        this.save(prev);
        this.setState(prev);
      },
      reset: () => { const f = this.fresh(); this.save(f); this.setState(f); }
    };
  }
}

</script>
</body>
</html>

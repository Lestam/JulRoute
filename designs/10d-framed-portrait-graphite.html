<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10D Framed portrait graphite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      
      <div style="padding:30px;background:linear-gradient(140deg,#33322f 0%,#131312 100%);box-shadow:0 42px 90px -44px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.08);">
        <div style="width:840px;height:1188px;background:#0e0e0f;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);display:flex;flex-direction:column;">
          <div style="height:700px;overflow:hidden;position:relative;">
            <img src="assets/relief-4.png" alt="3D-printed relief map of Berlin" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div style="flex:1;padding:52px 60px 56px;display:flex;flex-direction:column;">
            <div style="font-family:'Space Mono',monospace;font-size:15px;letter-spacing:0.22em;text-transform:uppercase;color:#d8352a;margin-bottom:20px;">Finisher · 42.195 km</div>
            <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:62px;line-height:0.94;text-transform:uppercase;color:#eceae6;">Berlin<br>Marathon</div>
            <div style="display:flex;align-items:baseline;gap:16px;margin-top:18px;">
              <span style="font-family:'Oswald',sans-serif;font-weight:500;font-size:32px;line-height:1;text-transform:uppercase;color:#eceae6;letter-spacing:0.02em;">Alex Runner</span>
              <span style="font-family:'Space Mono',monospace;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:#8b8a86;">16 Mar 2026</span>
            </div>
            <div style="height:1px;background:#2c2c2d;margin:30px 0 24px;"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
              <div>
                <div style="font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#8b8a86;">Distance</div>
                <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;color:#eceae6;margin-top:6px;">42.195 km</div>
              </div>
              <div>
                <div style="font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#8b8a86;">Time</div>
                <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;color:#eceae6;margin-top:6px;">02:54:11</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    
</body>
</html>

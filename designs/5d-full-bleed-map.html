<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>5D Full Bleed Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #c8452f 0%, rgba(0,0,0,0.35) 100%), #c8452f;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#efece3;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <img src="assets/map-city.svg" alt="" style="position:absolute;top:-160px;left:0;width:630px;opacity:0.5;filter:invert(1);display:block;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(239,236,227,0.92) 0%,rgba(239,236,227,0.18) 24%,rgba(239,236,227,0.18) 66%,rgba(239,236,227,0.95) 88%);"></div>

        <!-- raised route -->
        <svg width="630" height="900" viewBox="0 0 630 900" style="position:absolute;top:0;left:0;">
          <g style="filter:drop-shadow(3px 6px 4px rgba(40,34,24,0.4));">
            <path d="M112 566 C 168 528, 176 470, 232 442 C 288 414, 300 356, 358 336 C 412 318, 448 344, 476 386 C 506 432, 468 476, 420 494 C 366 514, 322 492, 286 520 C 250 548, 268 592, 316 608" fill="none" stroke="#c8452f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="112" cy="566" r="10" fill="#efece3" stroke="#c8452f" stroke-width="7"/>
            <circle cx="316" cy="608" r="8" fill="#c8452f"/>
          </g>
        </svg>

        <!-- header -->
        <div style="position:absolute;top:74px;left:0;right:0;text-align:center;">
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.36em;text-transform:uppercase;color:#8d8577;margin-bottom:14px;">Marathon · 16 March 2026</div>
          <div style="font-family:'Spectral',serif;font-weight:500;font-size:44px;line-height:1;color:#211f1a;letter-spacing:-0.01em;">Barcelona</div>
        </div>

        <!-- footer -->
        <div style="position:absolute;bottom:72px;left:56px;right:56px;">
          <div style="text-align:center;font-family:'Spectral',serif;font-weight:600;font-size:34px;color:#211f1a;line-height:1;">Alex Runner</div>
          <div style="margin-top:26px;border-top:1px solid #cfc9bb;padding-top:18px;display:flex;">
            <div style="flex:1;text-align:center;border-right:1px solid #cfc9bb;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8d8577;">Distance</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:18px;color:#211f1a;margin-top:5px;">42,195 km</div>
            </div>
            <div style="flex:1;text-align:center;border-right:1px solid #cfc9bb;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8d8577;">Time</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:18px;color:#211f1a;margin-top:5px;">03:42:58</div>
            </div>
            <div style="flex:1;text-align:center;border-right:1px solid #cfc9bb;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8d8577;">Pace</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:18px;color:#211f1a;margin-top:5px;">5:16 /km</div>
            </div>
            <div style="flex:1;text-align:center;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8d8577;">Elev</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:18px;color:#211f1a;margin-top:5px;">287 m</div>
            </div>
          </div>
          <div style="text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.26em;text-transform:uppercase;color:#a49c8d;margin-top:16px;">Barcelona, Spain · 41.3874°N 2.1686°E</div>
        </div>
      </div>
      </div>
    
</body>
</html>

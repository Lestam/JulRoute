<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10A Framed landscape side panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      
      <div style="padding:30px;background:linear-gradient(140deg,#ffffff 0%,#f0eeea 100%);box-shadow:0 42px 90px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(0,0,0,0.07);">
        <div style="width:1260px;height:840px;background:#f7f6f4;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);display:flex;">
          <div style="width:770px;height:100%;overflow:hidden;position:relative;">
            <img src="assets/relief-1.png" alt="3D-printed relief map of Valencia" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div style="flex:1;padding:74px 60px 60px;display:flex;flex-direction:column;">
            <div style="font-family:'Space Mono',monospace;font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:#d8352a;margin-bottom:22px;">Finisher · 16 March 2026</div>
            <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:60px;line-height:0.94;text-transform:uppercase;color:#141414;letter-spacing:0.005em;">Valencia<br>Marathon</div>
            <div style="font-family:'Oswald',sans-serif;font-weight:500;font-size:34px;line-height:1;text-transform:uppercase;color:#141414;letter-spacing:0.02em;margin-top:22px;">Alex Runner</div>
            <div style="flex:1;"></div>
            <div style="font-family:'Space Mono',monospace;font-size:14px;letter-spacing:0.18em;text-transform:uppercase;color:#8b8a86;margin-bottom:6px;">42.195 km in</div>
            <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:104px;line-height:0.9;color:#d8352a;letter-spacing:-0.005em;">03:18:42</div>
            <div style="height:1px;background:#d8352a;margin:26px 0 22px;"></div>
            <div style="display:grid;grid-template-columns:1fr 1px 1fr;gap:20px;align-items:start;">
              <div>
                <div style="font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#6e6d69;">Distance</div>
                <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;color:#d8352a;margin-top:6px;">42.195 km</div>
              </div>
              <div style="background:#ddd9d2;height:56px;"></div>
              <div>
                <div style="font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#6e6d69;">Elevation gain</div>
                <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;color:#d8352a;margin-top:6px;">312 m</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    
</body>
</html>

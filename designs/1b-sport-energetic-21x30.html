<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1B Sport Energetic -21x30-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #ffffff33 0%, #ee5b23 60%), #ee5b23;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(0,0,0,0.10);">
        <div style="width:630px;height:900px;background:#ffffff;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;display:flex;flex-direction:column;">

        <!-- header -->
        <div style="padding:60px 60px 0;">
          <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:#ee5b23;margin-bottom:14px;">Finisher · 42.195 km</div>
          <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:66px;line-height:0.9;text-transform:uppercase;color:#1c1b19;letter-spacing:0.005em;">Barcelona<br>Marathon<span style="color:#ee5b23;">.</span></div>
          <div style="font-family:'Oswald',sans-serif;font-weight:300;font-size:26px;line-height:1;text-transform:uppercase;color:#8d8a83;letter-spacing:0.18em;margin-top:8px;">2025</div>
        </div>

        <!-- disc -->
        <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#fdece4 0%,#ffffff 70%);"></div>
          <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;">
            <div style="position:relative;width:440px;height:440px;filter:drop-shadow(10px 16px 22px rgba(90,50,25,0.28));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.9), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
            <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#b0aca2;">3D-printed relief part · Ø 150 mm</div>
          </div>
        </div>

        <!-- name -->
        <div style="padding:0 60px 28px;display:flex;align-items:baseline;justify-content:space-between;">
          <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:38px;line-height:1;text-transform:uppercase;color:#1c1b19;letter-spacing:0.01em;">Alex Runner</div>
          <div style="text-align:right;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8d8a83;line-height:1.5;">Barcelona, Spain<br>16 Mar 2025</div>
        </div>

        <!-- accent footer band -->
        <div style="background:#ee5b23;padding:26px 60px 30px;display:flex;">
          <div style="flex:1;border-right:1px solid rgba(255,255,255,0.28);">
            <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;line-height:1;color:#fff;">03:42:58</div>
            <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#ffd9c8;margin-top:6px;">Time</div>
          </div>
          <div style="flex:1;padding-left:22px;border-right:1px solid rgba(255,255,255,0.28);">
            <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;line-height:1;color:#fff;">5:16<span style="font-size:16px;font-weight:300;"> /km</span></div>
            <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#ffd9c8;margin-top:6px;">Avg pace</div>
          </div>
          <div style="flex:1;padding-left:22px;">
            <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;line-height:1;color:#fff;">287<span style="font-size:16px;font-weight:300;"> m</span></div>
            <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#ffd9c8;margin-top:6px;">Elev gain</div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>

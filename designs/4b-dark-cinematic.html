<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4B Dark Cinematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #26292d 0%, rgba(0,0,0,0.35) 100%), #26292d;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:900px;height:630px;background:#191b1e;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <!-- soft radial behind disc -->
        <div style="position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,#2a2d31 0%,#191b1e 68%);top:-5px;left:-60px;"></div>

        <!-- disc -->
        <div style="position:absolute;top:85px;left:56px;width:460px;height:460px;border-radius:50%;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);">
          <img src="assets/disc.png" style="width:104%;height:104%;object-fit:cover;margin:-2%;display:block;">
        </div>

        <!-- text column -->
        <div style="position:absolute;top:0;bottom:0;left:576px;right:60px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#e0483a;margin-bottom:14px;">Finisher · 42.195 km</div>
          <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:46px;line-height:0.92;text-transform:uppercase;color:#f2efe9;letter-spacing:0.005em;">Barcelona<br>Marathon<span style="color:#e0483a;">.</span></div>
          <div style="font-family:'Oswald',sans-serif;font-weight:300;font-size:20px;line-height:1;text-transform:uppercase;color:#8b8d90;letter-spacing:0.2em;margin-top:8px;">2025</div>

          <div style="margin-top:26px;font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;line-height:1;text-transform:uppercase;color:#f2efe9;letter-spacing:0.01em;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8b8d90;margin-top:9px;">Barcelona, Spain · 16 Mar 2025</div>

          <div style="margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px 18px;">
            <div>
              <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#e0483a;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8b8d90;">Distance</span></div>
              <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;color:#f2efe9;margin-top:4px;">42.195 km</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#e0483a;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8b8d90;">Time</span></div>
              <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;color:#f2efe9;margin-top:4px;">03:42:58</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#e0483a;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8b8d90;">Avg pace</span></div>
              <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;color:#f2efe9;margin-top:4px;">5:16 /km</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#e0483a;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8b8d90;">Elev gain</span></div>
              <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;color:#f2efe9;margin-top:4px;">287 m</div>
            </div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>

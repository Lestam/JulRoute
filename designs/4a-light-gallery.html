<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4A Light Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #c0392b 0%, rgba(0,0,0,0.35) 100%), #c0392b;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:900px;height:630px;background:#f4f1ea;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <div style="position:absolute;inset:28px;border:1px solid #ddd7cb;"></div>

        <!-- text column -->
        <div style="position:absolute;top:0;bottom:0;left:64px;width:352px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#c0392b;margin-bottom:16px;">16 March 2025 · Barcelona</div>
          <div style="font-family:'Spectral',serif;font-weight:500;font-size:38px;line-height:1.04;color:#22201c;letter-spacing:-0.005em;">Barcelona<br>Marathon 2025</div>
          <div style="width:38px;height:2px;background:#c0392b;margin:22px 0 28px;"></div>

          <div style="font-family:'Spectral',serif;font-weight:600;font-size:40px;line-height:1;color:#22201c;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a877f;margin-top:11px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>

          <div style="margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;">
            <div>
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a29e93;">Distance</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#22201c;margin-top:4px;">42.195 km</div>
            </div>
            <div>
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a29e93;">Time</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#22201c;margin-top:4px;">03:42:58</div>
            </div>
            <div>
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a29e93;">Avg pace</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#22201c;margin-top:4px;">5:16 /km</div>
            </div>
            <div>
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a29e93;">Elev gain</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#22201c;margin-top:4px;">287 m</div>
            </div>
          </div>
        </div>

        <!-- divider -->
        <div style="position:absolute;top:96px;bottom:96px;left:452px;width:1px;background:#ddd7cb;"></div>

        <!-- disc -->
        <div style="position:absolute;top:90px;left:398px;width:450px;height:450px;border-radius:50%;overflow:hidden;box-shadow:0 24px 50px -22px rgba(30,28,22,0.45);">
          <img src="assets/disc.png" style="width:104%;height:104%;object-fit:cover;margin:-2%;display:block;">
        </div>
      </div>
      </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1A Museum Minimal -21x30-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #24211c 0%, rgba(0,0,0,0.35) 100%), #24211c;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#f6f4ef;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <div style="position:absolute;inset:30px;border:1px solid #d9d5cb;"></div>
        <div style="position:absolute;inset:64px 72px;display:flex;flex-direction:column;">

          <!-- header -->
          <div style="text-align:center;">
            <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.42em;text-transform:uppercase;color:#c5402f;margin-bottom:16px;">Marathon</div>
            <div style="font-family:'Spectral',serif;font-weight:500;font-size:33px;line-height:1.08;color:#22201c;letter-spacing:-0.005em;">Barcelona<br>Marathon 2025</div>
            <div style="width:34px;height:2px;background:#c5402f;margin:18px auto 0;"></div>
          </div>

          <!-- disc -->
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
            <div style="position:relative;width:450px;height:450px;filter:drop-shadow(10px 16px 22px rgba(60,50,36,0.30));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.85), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
            <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#a29e93;">3D-printed relief part · Ø 150 mm</div>
          </div>

          <!-- name -->
          <div style="text-align:center;margin-bottom:30px;">
            <div style="font-family:'Spectral',serif;font-weight:600;font-size:44px;line-height:1;color:#22201c;letter-spacing:0.005em;">Alex Runner</div>
            <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8a877f;margin-top:12px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>
          </div>

          <!-- stats -->
          <div style="border-top:1px solid #d4d0c6;padding-top:22px;display:flex;">
            <div style="flex:1;text-align:center;border-right:1px solid #d4d0c6;">
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#a29e93;">Distance</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#22201c;margin-top:5px;">42.195 km</div>
            </div>
            <div style="flex:1;text-align:center;border-right:1px solid #d4d0c6;">
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#a29e93;">Time</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#22201c;margin-top:5px;">03:42:58</div>
            </div>
            <div style="flex:1;text-align:center;border-right:1px solid #d4d0c6;">
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#a29e93;">Avg pace</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#22201c;margin-top:5px;">5:16 /km</div>
            </div>
            <div style="flex:1;text-align:center;">
              <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#a29e93;">Elev gain</div>
              <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#22201c;margin-top:5px;">287 m</div>
            </div>
          </div>
          <div style="text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:#b4b0a5;margin-top:16px;">16 March 2025</div>

        </div>
      </div>
      </div>
    
</body>
</html>

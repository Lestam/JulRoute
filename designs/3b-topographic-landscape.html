<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3B Topographic Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #bb2649 0%, rgba(0,0,0,0.35) 100%), #bb2649;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:900px;height:630px;background:#fdf5ef;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <!-- contour bg -->
        <svg width="900" height="630" viewBox="0 0 900 630" style="position:absolute;top:0;left:0;">
          <g fill="none" stroke="#bb2649" stroke-width="1.2" opacity="0.11">
            <circle cx="300" cy="315" r="72"/><circle cx="300" cy="315" r="144"/><circle cx="300" cy="315" r="216"/><circle cx="300" cy="315" r="288"/><circle cx="300" cy="315" r="360"/><circle cx="300" cy="315" r="432"/>
          </g>
        </svg>
        <!-- peach halo -->
        <div style="position:absolute;width:496px;height:496px;border-radius:50%;background:#ffbe98;opacity:0.55;top:67px;left:52px;"></div>

        <!-- disc -->
        <div style="position:absolute;top:90px;left:75px;width:450px;height:450px;filter:drop-shadow(10px 16px 22px rgba(120,40,60,0.26));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.9), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
        <div style="position:absolute;top:552px;left:75px;width:450px;text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#b79e91;">3D-printed relief part · Ø 150 mm</div>

        <!-- right text column -->
        <div style="position:absolute;top:0;bottom:0;left:596px;right:52px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#bb2649;margin-bottom:14px;">Marathon · 42.195 km</div>
          <div style="font-family:'Spectral',serif;font-weight:500;font-size:31px;line-height:1.06;color:#35363e;letter-spacing:-0.005em;">Barcelona Marathon 2025</div>
          <div style="width:34px;height:2px;background:#bb2649;margin:18px 0 26px;"></div>

          <div style="font-family:'Spectral',serif;font-weight:600;font-size:38px;line-height:1;color:#35363e;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a827e;margin-top:10px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>

          <div style="margin-top:30px;display:flex;flex-direction:column;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #ecd9cc;">
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Distance</span>
              <span style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;">42.195 km</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #ecd9cc;">
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Time</span>
              <span style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;">03:42:58</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #ecd9cc;">
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Avg pace</span>
              <span style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;">5:16 /km</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #ecd9cc;border-bottom:1px solid #ecd9cc;">
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Elev gain</span>
              <span style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;">287 m</span>
            </div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1C Technical GPS -21x30-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #1f7a52 0%, rgba(0,0,0,0.35) 100%), #1f7a52;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#f4f5f2;background-image:repeating-linear-gradient(0deg,transparent 0 47px,rgba(31,122,82,0.06) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(31,122,82,0.06) 47px 48px);box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <div style="position:absolute;inset:48px;display:flex;flex-direction:column;">

          <!-- data header -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#5a6b60;padding-bottom:14px;border-bottom:1.5px solid #1f7a52;">
            <span>GPX · Track 0426</span>
            <span>41.3874°N&nbsp;&nbsp;2.1686°E</span>
          </div>

          <!-- title -->
          <div style="padding:22px 0 6px;">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;line-height:1.02;color:#1a1c1a;letter-spacing:-0.01em;">Barcelona Marathon 2025</div>
            <div style="display:flex;align-items:baseline;gap:10px;margin-top:14px;">
              <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#1f7a52;">Athlete</span>
              <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:#1a1c1a;">Alex Runner</span>
            </div>
          </div>

          <!-- disc -->
          <div style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;">
            <div style="position:absolute;top:50%;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,#bcc4bd 0 6px,transparent 6px 12px);"></div>
            <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(0deg,#bcc4bd 0 6px,transparent 6px 12px);"></div>
            <div style="position:relative;width:390px;height:390px;filter:drop-shadow(10px 16px 22px rgba(20,60,45,0.28));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.85), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
          </div>
          <div style="text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#9aa39b;margin-top:-6px;margin-bottom:14px;">3D-printed relief part · Ø 150 mm</div>

          <!-- elevation profile -->
          <div style="margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#5a6b60;margin-bottom:6px;">
              <span>Elevation profile</span><span style="color:#1f7a52;">↑ 287 m</span>
            </div>
            <svg width="534" height="72" viewBox="0 0 534 72" preserveAspectRatio="none" style="display:block;width:100%;">
              <path d="M0,72 L0,50 L44,40 L88,46 L132,22 L176,34 L220,14 L264,28 L308,10 L352,32 L396,20 L440,42 L484,26 L534,48 L534,72 Z" fill="rgba(31,122,82,0.14)"/>
              <polyline points="0,50 44,40 88,46 132,22 176,34 220,14 264,28 308,10 352,32 396,20 440,42 484,26 534,48" fill="none" stroke="#1f7a52" stroke-width="2"/>
            </svg>
          </div>

          <!-- stats grid -->
          <div style="flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #cdd4cc;border-radius:2px;overflow:hidden;">
            <div style="padding:14px 16px;border-right:1px solid #cdd4cc;border-bottom:1px solid #cdd4cc;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Distance</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a1c1a;margin-top:4px;">42.195<span style="font-size:12px;color:#8a938b;"> km</span></div>
            </div>
            <div style="padding:14px 16px;border-right:1px solid #cdd4cc;border-bottom:1px solid #cdd4cc;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Time</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a1c1a;margin-top:4px;">03:42:58</div>
            </div>
            <div style="padding:14px 16px;border-bottom:1px solid #cdd4cc;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Avg pace</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a1c1a;margin-top:4px;">5:16<span style="font-size:12px;color:#8a938b;"> /km</span></div>
            </div>
            <div style="padding:14px 16px;border-right:1px solid #cdd4cc;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Location</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#1a1c1a;margin-top:6px;">Barcelona, ES</div>
            </div>
            <div style="padding:14px 16px;border-right:1px solid #cdd4cc;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Date</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#1a1c1a;margin-top:6px;">16 Mar 2025</div>
            </div>
            <div style="padding:14px 16px;">
              <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#8a938b;">Elev gain</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#1a1c1a;margin-top:6px;">287 m</div>
            </div>
          </div>

        </div>
      </div>
      </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2B Topographic Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #bb2649 0%, rgba(0,0,0,0.35) 100%), #bb2649;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#fdf5ef;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <!-- contour bg -->
        <svg width="630" height="900" viewBox="0 0 630 900" style="position:absolute;top:0;left:0;">
          <g fill="none" stroke="#bb2649" stroke-width="1.2" opacity="0.11">
            <circle cx="315" cy="470" r="72"/><circle cx="315" cy="470" r="144"/><circle cx="315" cy="470" r="216"/><circle cx="315" cy="470" r="288"/><circle cx="315" cy="470" r="360"/><circle cx="315" cy="470" r="432"/><circle cx="315" cy="470" r="504"/>
          </g>
        </svg>
        <!-- peach halo -->
        <div style="position:absolute;width:504px;height:504px;border-radius:50%;background:#ffbe98;opacity:0.55;top:218px;left:63px;"></div>

        <!-- header -->
        <div style="position:absolute;top:62px;left:56px;right:56px;text-align:center;">
          <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.34em;text-transform:uppercase;color:#bb2649;margin-bottom:14px;">Marathon · 42.195 km</div>
          <div style="font-family:'Spectral',serif;font-weight:500;font-size:34px;line-height:1.06;color:#35363e;letter-spacing:-0.005em;">Barcelona Marathon 2025</div>
          <div style="width:34px;height:2px;background:#bb2649;margin:16px auto 0;"></div>
        </div>

        <!-- disc -->
        <div style="position:absolute;top:236px;left:90px;width:450px;height:450px;filter:drop-shadow(10px 16px 22px rgba(120,40,60,0.26));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.9), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
        <div style="position:absolute;top:696px;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#b79e91;">3D-printed relief part · Ø 150 mm</div>

        <!-- name -->
        <div style="position:absolute;top:720px;left:0;right:0;text-align:center;">
          <div style="font-family:'Spectral',serif;font-weight:600;font-size:40px;line-height:1;color:#35363e;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8a827e;margin-top:9px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>
        </div>

        <!-- stats -->
        <div style="position:absolute;left:56px;right:56px;bottom:44px;border-top:1px solid #ecd9cc;padding-top:16px;display:flex;">
          <div style="flex:1;text-align:center;border-right:1px solid #ecd9cc;">
            <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Distance</div>
            <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;margin-top:5px;">42.195 km</div>
          </div>
          <div style="flex:1;text-align:center;border-right:1px solid #ecd9cc;">
            <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Time</div>
            <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;margin-top:5px;">03:42:58</div>
          </div>
          <div style="flex:1;text-align:center;border-right:1px solid #ecd9cc;">
            <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Avg pace</div>
            <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;margin-top:5px;">5:16 /km</div>
          </div>
          <div style="flex:1;text-align:center;">
            <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#bb2649;">Elev gain</div>
            <div style="font-family:'Spectral',serif;font-weight:500;font-size:19px;color:#35363e;margin-top:5px;">287 m</div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>5A Dark Editorial Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #d8352a 0%, rgba(0,0,0,0.35) 100%), #d8352a;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#2b2c2e;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:96px 56px 0;">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:52px;line-height:0.95;color:#f4f2ee;letter-spacing:-0.02em;">Barcelona</div>
            <div style="font-family:'Space Mono',monospace;font-size:13px;color:#8f9093;padding-bottom:8px;">/ 42K</div>
          </div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:18px;">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;letter-spacing:0.13em;text-transform:uppercase;color:#c9c8c5;">Alex Runner</div>
            <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#8f9093;">Bib / 14303</div>
          </div>
        </div>

        <!-- map band -->
        <div style="margin-top:34px;position:relative;height:452px;overflow:hidden;background:#232426;">
          <img src="assets/map-city.svg" alt="" style="position:absolute;top:-190px;left:0;width:630px;opacity:0.5;display:block;">
          <svg width="630" height="452" viewBox="0 0 630 452" style="position:absolute;top:0;left:0;">
            <g style="filter:drop-shadow(4px 7px 5px rgba(0,0,0,0.75));">
              <polyline points="72,382 118,352 172,356 214,318 268,326 306,286 352,296 398,254 452,262 498,224 556,214" fill="none" stroke="#d8352a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="72,382 118,352 172,356 214,318 268,326 306,286 352,296 398,254 452,262 498,224 556,214" fill="none" stroke="#ef5a4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.5,-2)" opacity="0.75"/>
            </g>
          </svg>
        </div>

        <div style="flex:1;"></div>

        <!-- data -->
        <div style="padding:0 56px 76px;display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;">
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Date /</span><span>16 Mar 2026</span></div>
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Time /</span><span>03:42:58</span></div>
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Distance /</span><span>42,195 km</span></div>
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Pace /</span><span>5:16 min/km</span></div>
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Elev /</span><span>287 m</span></div>
          <div style="display:flex;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.04em;color:#c9c8c5;"><span style="color:#8f9093;">Geo /</span><span>41.39°N 2.17°E</span></div>
        </div>
      </div>
      </div>
    
</body>
</html>

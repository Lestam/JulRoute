<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2A Color Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      

      <div style="padding:26px;background:linear-gradient(140deg, #0f4c81 0%, rgba(0,0,0,0.35) 100%), #0f4c81;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(255,255,255,0.14);">
        <div style="width:630px;height:900px;background:#fbfaf7;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <!-- bg layers -->
        <div style="position:absolute;top:0;left:0;width:100%;height:296px;background:#0f4c81;"></div>
        <div style="position:absolute;width:540px;height:540px;border-radius:50%;background:#f5df4d;top:205px;left:45px;"></div>
        <div style="position:absolute;width:120px;height:120px;background:#ff6f61;top:-40px;right:-40px;transform:rotate(45deg);"></div>
        <div style="position:absolute;left:56px;bottom:150px;width:44px;height:4px;background:#ff6f61;"></div>

        <!-- header over blue -->
        <div style="position:absolute;top:58px;left:56px;right:56px;">
          <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:#f5df4d;margin-bottom:16px;">Marathon · 16 Mar 2025</div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:0.98;text-transform:uppercase;color:#ffffff;letter-spacing:-0.01em;">Barcelona<br>Marathon 2025</div>
        </div>

        <!-- disc -->
        <div style="position:absolute;top:250px;left:90px;width:450px;height:450px;filter:drop-shadow(10px 16px 22px rgba(15,40,70,0.32));">
          <div style="width:100%;height:100%;overflow:hidden;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.9), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief part" style="position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover;display:block;">
          </div>
        </div>
        <div style="position:absolute;top:712px;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#a9a599;">3D-printed relief part · Ø 150 mm</div>

        <!-- name -->
        <div style="position:absolute;top:742px;left:0;right:0;text-align:center;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#1a2733;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8a877f;margin-top:10px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>
        </div>

        <!-- stats -->
        <div style="position:absolute;left:56px;right:56px;bottom:52px;display:flex;">
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#ff6f61;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8a877f;">Distance</span></div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a2733;margin-top:5px;">42.195 km</div>
          </div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#0f4c81;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8a877f;">Time</span></div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a2733;margin-top:5px;">03:42:58</div>
          </div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#f5df4d;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8a877f;">Avg pace</span></div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a2733;margin-top:5px;">5:16 /km</div>
          </div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;background:#ff6f61;"></span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8a877f;">Elev gain</span></div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:#1a2733;margin-top:5px;">287 m</div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>

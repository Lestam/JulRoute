<!DOCTYPE html>
<html lang="en">
<head>

<title>9A Square bone-terracotta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }

<body>

      
      <div style="padding:26px;background:linear-gradient(140deg, #ffffff33 0%, #b4573c 60%), #b4573c;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(0,0,0,0.10);">

        <div style="position:absolute;inset:26px;border:1px solid #ddd6c8;"></div>
        <div style="position:absolute;top:0;bottom:0;left:60px;width:340px;display:flex;flex-direction:column;justify-content:center;">

          <div style="margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px 18px;">
            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a49a88;">Distance</div><div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#231f19;margin-top:4px;">42,195 km</div></div>

            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#a49a88;">Elev gain</div><div style="font-family:'Spectral',serif;font-weight:500;font-size:22px;color:#231f19;margin-top:4px;">287 m</div></div>
          </div>
        </div>
        <div style="position:absolute;top:115px;left:450px;width:400px;height:400px;filter:drop-shadow(10px 16px 20px rgba(45,38,26,0.34));">
          <div style="width:100%;height:100%;overflow:hidden;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.85), inset 0 -14px 26px rgba(60,50,36,0.16);">
            <img src="assets/disc.png" alt="3D-printed relief map, square cut" style="position:absolute;width:142%;height:142%;left:-21%;top:-21%;object-fit:cover;display:block;">
          </div>
        </div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>9D Triangle forest-lime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e5e1; font-family:'Space Grotesk',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px; }
  a { color:#c5402f; text-decoration:none; }
  a:hover { color:#a12f21; }
</style>
</head>
<body>

      
      <div style="padding:26px;background:linear-gradient(140deg, #ffffff33 0%, #c6e86a 60%), #c6e86a;box-shadow:0 40px 88px -44px rgba(30,28,22,0.6), inset 0 0 0 1px rgba(0,0,0,0.10);">
        <div style="width:900px;height:630px;background:#0f3227;box-shadow:0 8px 22px -10px rgba(0,0,0,0.45);position:relative;overflow:hidden;">
        <div style="position:absolute;top:64px;left:60px;right:60px;">
          <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.32em;text-transform:uppercase;color:#c6e86a;">Trail marathon · 16.03.2026</div>
        </div>
        <div style="position:absolute;top:118px;left:36px;width:470px;height:420px;filter:drop-shadow(12px 18px 22px rgba(0,0,0,0.55));">
          <div style="width:100%;height:100%;overflow:hidden;position:relative;clip-path:polygon(50% 0%, 100% 100%, 0% 100%);">
            <img src="assets/disc.png" alt="3D-printed relief map, triangular cut" style="position:absolute;width:180%;height:180%;left:-40%;top:-32%;object-fit:cover;display:block;">
          </div>
        </div>
        <div style="position:absolute;top:0;bottom:0;left:534px;right:56px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:46px;line-height:0.98;color:#eef5ee;letter-spacing:-0.02em;">Barcelona<br>Marathon</div>
          <div style="width:44px;height:3px;background:#c6e86a;margin:22px 0 24px;"></div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:34px;line-height:1;color:#c6e86a;letter-spacing:-0.015em;">Alex Runner</div>
          <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#7fa892;margin-top:10px;">Barcelona, Spain · 41.3874° N 2.1686° E</div>
          <div style="margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;">
            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7fa892;">Distance</div><div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;color:#eef5ee;margin-top:4px;">42,195 km</div></div>
            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7fa892;">Time</div><div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;color:#eef5ee;margin-top:4px;">03:42:58</div></div>
            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7fa892;">Avg pace</div><div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;color:#eef5ee;margin-top:4px;">5:16 /km</div></div>
            <div><div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#7fa892;">Elev gain</div><div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;color:#eef5ee;margin-top:4px;">287 m</div></div>
          </div>
        </div>
      </div>
      </div>
    
</body>
</html>
